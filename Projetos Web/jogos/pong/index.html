<!DOCTYPE html>
<html lang="pt" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>Pong</title>
    <link rel="stylesheet" href="css/Style_Jogo.css">
    <!-- Modo embutido (index.html?embutido=1): usado quando o jogo abre dentro do currículo -->
    <script>
        if (/[?&]embutido=1\b/.test(location.search)) {
            document.documentElement.classList.add("embutido");
            // as setas e o espaço não rolam a página de fora
            document.addEventListener("keydown", function (e) {
                if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].indexOf(e.code) !== -1) {
                    e.preventDefault();
                }
            });
        }
    </script>
</head>
<body>
    <!-- Elemento canvas com as dimensões especificadas -->
    <canvas id="canvas" width="1280" height="720"></canvas>

    <!-- Link para o script do jogo -->
    <script src="script/jogo.js" charset="utf-8"></script>
</body>
</html>
